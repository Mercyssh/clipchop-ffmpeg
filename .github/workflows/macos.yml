# Builds the macOS (Apple Silicon) ffmpeg + ffprobe and adds them to an
# existing release: the programs, their checksums, and the exact build files.
# Run it from the Actions tab or: gh workflow run macos.yml -f tag=v1.0.0
name: macOS ffmpeg

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release to add the macOS build to (e.g. v1.0.0). It must already exist.
        required: true
      replace:
        description: Rebuild even if the release already has a macOS build (its checksums will change)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: macos-ffmpeg-${{ inputs.tag }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      TRIPLE: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Check the release
        id: check
        run: |
          assets=$(gh release view "$TAG" --json assets -q '.assets[].name') \
            || { echo "::error::Release $TAG doesn't exist. Create it first."; exit 1; }
          if grep -qx "SHA256SUMS.$TRIPLE" <<<"$assets" && [ "${{ inputs.replace }}" != "true" ]; then
            echo "::notice::$TAG already has a macOS build; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The release's components.env pins what every platform's build contains.
          gh release download "$TAG" -p components.env -D "$RUNNER_TEMP/release"
          if ! diff -u "$RUNNER_TEMP/release/components.env" scripts/ffmpeg/components.env; then
            echo "::error::scripts/ffmpeg/components.env differs from the one in $TAG. Build from the commit that matches it, or make a new release."
            exit 1
          fi

      - name: Build
        if: steps.check.outputs.skip != 'true'
        run: bash scripts/ffmpeg/build.sh --install-deps

      - name: Check it only needs macOS's own libraries
        if: steps.check.outputs.skip != 'true'
        run: |
          for b in ffmpeg ffprobe; do
            f=".ffmpeg-build/dist/$b-$TRIPLE"
            otool -L "$f"
            if otool -L "$f" | tail -n +2 | awk '{print $1}' | grep -vE '^(/usr/lib/|/System/Library/)'; then
              echo "::error::$b links a library that isn't part of macOS"; exit 1
            fi
            vtool -show-build "$f" | grep -E 'minos|platform'
          done

      - name: Add to the release
        if: steps.check.outputs.skip != 'true'
        run: |
          d=.ffmpeg-build/dist; s="$d/source"; up="$RUNNER_TEMP/upload"; mkdir -p "$up"
          cp "$d/ffmpeg-$TRIPLE" "$d/ffprobe-$TRIPLE" "$d/SHA256SUMS.$TRIPLE" "$s/configure-$TRIPLE.txt" "$up/"
          cp "$s/build.sh" "$up/build-$TRIPLE.sh"
          cp "$s/components.env" "$up/components-$TRIPLE.env"
          tarball=$(cd "$s" && ls ffmpeg-*.tar.xz)
          gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "$tarball" || cp "$s/$tarball" "$up/"
          gh release upload "$TAG" "$up"/* --clobber

          # Put the macOS checksums in the release description (replacing an earlier macOS section).
          gh release view "$TAG" --json body -q .body > "$RUNNER_TEMP/body.md"
          python3 - "$RUNNER_TEMP/body.md" "$d/SHA256SUMS.$TRIPLE" <<'EOF'
          import re, sys
          body_path, sums_path = sys.argv[1], sys.argv[2]
          body = open(body_path, encoding="utf-8").read().replace("\r\n", "\n")
          body = re.sub(r"\n*<!-- macos -->.*?<!-- /macos -->\n*", "\n\n", body, flags=re.S).rstrip()
          body = re.sub(r"\s*\(macOS will be added[^)]*\)", ", macOS Apple Silicon (11+)", body)
          sums = "\n".join("    " + l for l in open(sums_path).read().split("\n") if l.strip())
          body += ("\n\n<!-- macos -->\n## macOS (Apple Silicon)\n\n"
                   "Built by the `macOS ffmpeg` workflow in this repository. Build files: "
                   "`build-aarch64-apple-darwin.sh`, `components-aarch64-apple-darwin.env`, "
                   "`configure-aarch64-apple-darwin.txt`.\n\n"
                   "Checksums (SHA-256) of the `ffmpeg` / `ffprobe` shipped with ClipChop for macOS:\n\n"
                   + sums + "\n<!-- /macos -->\n")
          open(body_path, "w", encoding="utf-8").write(body)
          EOF
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/body.md"
          cat "$d/SHA256SUMS.$TRIPLE"
